test:
  name: FlashChain Fabric Read Latency Under Load
  description: >
    Measures Hyperledger Fabric ReadAsset latency under increasing concurrent
    query load. Demonstrates that Fabric read latency degrades under pressure,
    motivating the context-aware Redis caching layer in FlashChain.

  rounds:
    - label: "10 TPS"
      description: "Baseline: 10 concurrent read queries per second"
      txDuration: 20
      rateControl:
        type: fixed-rate
        opts:
          tps: 10
      workload:
        module: workload/readAsset.js

    - label: "30 TPS"
      description: "Moderate load: 30 concurrent read queries per second"
      txDuration: 20
      rateControl:
        type: fixed-rate
        opts:
          tps: 30
      workload:
        module: workload/readAsset.js

    - label: "60 TPS"
      description: "High load: 60 concurrent read queries per second"
      txDuration: 20
      rateControl:
        type: fixed-rate
        opts:
          tps: 60
      workload:
        module: workload/readAsset.js

    - label: "100 TPS"
      description: "High load: 100 concurrent read queries per second"
      txDuration: 20
      rateControl:
        type: fixed-rate
        opts:
          tps: 100
      workload:
        module: workload/readAsset.js

    - label: "300 TPS"
      description: "Stress load: 300 concurrent read queries per second"
      txDuration: 20
      rateControl:
        type: fixed-rate
        opts:
          tps: 300
      workload:
        module: workload/readAsset.js

    - label: "600 TPS"
      description: "Heavy stress: 600 concurrent read queries per second"
      txDuration: 20
      rateControl:
        type: fixed-rate
        opts:
          tps: 600
      workload:
        module: workload/readAsset.js

    - label: "1000 TPS"
      description: "Peak stress: 1000 concurrent read queries per second"
      txDuration: 20
      rateControl:
        type: fixed-rate
        opts:
          tps: 1000
      workload:
        module: workload/readAsset.js

  workers:
    number: 1
